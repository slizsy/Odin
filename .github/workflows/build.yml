# builds odin for linux, mac and windows, runs the tests, and on a v* tag
# publishes the builds as a github release
name: build

on:
  push:
    branches: [main, rust-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: odin-linux-x86_64
            bin: odin
          - os: macos-latest
            name: odin-macos-arm64
            bin: odin
          - os: macos-13
            name: odin-macos-x86_64
            bin: odin
          - os: windows-latest
            name: odin-windows-x86_64.exe
            bin: odin.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - run: cargo build --release -p odin
      - shell: bash
        run: mv target/release/${{ matrix.bin }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
