# builds ready-to-run odin binaries for linux, mac and windows, tests each one,
# and on a v* tag publishes them as a github release
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "publish a release, like v0.1.2 (must match ODIN_VERSION). empty = just build"
        required: false
        default: ""

permissions:
  contents: read

# a newer push to the same branch cancels the old run, saves build minutes
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # full test run with address sanitizer, catches memory bugs before anything ships
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev libcurl4-openssl-dev
      - run: make test

  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh packaging/linux/build-static.sh
      - run: mv odin odin-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: odin-linux-x86_64
          path: odin-linux-x86_64

  linux-arm64:
    # github's free arm runners only exist for public repos
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh packaging/linux/build-static.sh
      - run: mv odin odin-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: odin-linux-arm64
          path: odin-linux-arm64

  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: test (native, with sanitizers)
        run: make test
      - name: universal binary (apple silicon + intel)
        run: |
          make clean
          make DEPFLAGS= CFLAGS="-O2 -arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          lipo -info odin
          ./odin version
          ./tests/user/run.sh "$PWD/odin"
          mv odin odin-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: odin-macos-universal
          path: odin-macos-universal

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make
          pacboy: gcc:p pkgconf:p curl:p zlib:p python:p
      - run: make STATIC=1 CFLAGS=-O2
      - name: make sure it only needs dlls that ship with windows
        run: |
          strip odin.exe
          ldd odin.exe
          if ldd odin.exe | grep -qiE '/(ucrt64|mingw64|usr)/'; then echo "odin.exe depends on msys2 dlls"; exit 1; fi
      - run: ./odin.exe version
      - run: make test STATIC=1 CFLAGS=-O2
      - name: install.ps1 parses on powershell 7 and windows powershell 5.1
        shell: pwsh
        run: |
          ./packaging/windows/check-install.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./packaging/windows/check-install.ps1
          if ($LASTEXITCODE) { exit 1 }
      - run: mv odin.exe odin-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: odin-windows-x86_64
          path: odin-windows-x86_64.exe

  release:
    # a pushed v* tag, or the run-workflow button with a version filled in
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && !cancelled() && !failure()
    needs: [sanitizers, linux-x86_64, linux-arm64, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # the tag has to match the version baked into the binary, otherwise
      # `odin upgrade` would think it's always out of date and loop forever
      - name: version matches the code
        env:
          WANT: ${{ inputs.version || github.ref_name }}
        run: |
          have="v$(sed -n 's/^#define ODIN_VERSION "\(.*\)"/\1/p' src/ui/banner.h)"
          echo "release $WANT, code says $have"
          [ "$WANT" = "$have" ] || { echo "::error::release $WANT but src/ui/banner.h says $have"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums so the installers can verify downloads
        run: cd dist && sha256sum odin-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
